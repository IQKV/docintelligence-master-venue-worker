# ===================================================================
# Spring Boot base configuration — overridden by active profile.
# ===================================================================

spring:
  application:
    name: docintelligence-master-venue-worker
  datasource:
    url: jdbc:postgresql://${iqkv.db.host}:${iqkv.db.port}/${iqkv.db.name}
    username: ${iqkv.db.username}
    password: ${iqkv.db.password}
  rabbitmq:
    host: ${iqkv.rabbitmq.host}
    port: ${iqkv.rabbitmq.port}
    username: ${iqkv.rabbitmq.username}
    password: ${iqkv.rabbitmq.password}
    listener:
      simple:
        # A rejected delivery must not be requeued immediately, otherwise a poison
        # message loops until its 24h TTL expires. After the bounded retries
        # below the message is dead-lettered for inspection.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2.0
          max-interval: 30s
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL:llama3.2}

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

iqkv:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:catalogservice}
    username: ${DB_USERNAME:svc_catalog_dba}
    password: ${DB_PASSWORD:svc_catalog_dba}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:svc_catalog_rmq}
    password: ${RABBITMQ_PASSWORD:svc_catalog_rmq}
  messaging:
    rabbitmq:
      # Controlled via MESSAGING_ENABLED env var; defaults to false for local safety.
      # Helm chart configmap sets this per environment (sit/uat/prd).
      enabled: ${MESSAGING_ENABLED:false}
  ingest:
    # The ingest tree written by docintelligence-mc-ingest-tagvenue-scraper into the shared
    # volume: one record folder per venue, each with venue.json and an assets/ folder. The
    # worker polls it, upserts each record into the master catalog, and removes the folder.
    dir: ${INGEST_DIR:/data/mc-ingest}
    # Fixed delay between two scans of the ingest tree. 30 minutes bounds how long a freshly
    # scraped record waits before it lands in the catalog.
    poll-interval: ${INGEST_POLL_INTERVAL:PT30M}
    # One entry per data provider, keyed by the provider key. 'enabled' gates that provider's
    # beans, so a source is switched off on its own without stopping the others. Helm chart
    # configmap sets these per environment (sit/uat/prd).
    source:
      tagvenue:
        enabled: ${INGEST_SOURCE_TAGVENUE_ENABLED:true}
  objectstorage:
    # Shares the catalog-assets bucket with docintelligence-catalog-service — the worker reads
    # the objects the service presigns and writes back derived artefacts, so bucket name and
    # credentials must match the service's configuration.
    endpoint: ${OBJECTSTORAGE_ENDPOINT:http://localhost:9000}
    # Public URL used to rewrite presigned URLs returned to external clients.
    # Leave blank to return presigned URLs unchanged (local dev, AWS S3).
    public-endpoint: ${OBJECTSTORAGE_PUBLIC_ENDPOINT:}
    access-key: ${OBJECTSTORAGE_ACCESS_KEY:iqkv}
    secret-key: ${OBJECTSTORAGE_SECRET_KEY:iqkv_password}
    bucket-name: ${OBJECTSTORAGE_BUCKET_NAME:catalog-assets}
    region: ${OBJECTSTORAGE_REGION:us-east-1}
    ssl: ${OBJECTSTORAGE_SSL:false}
    upload:
      max-file-size-bytes: ${OBJECTSTORAGE_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
      presigned-url-expiration-minutes: ${OBJECTSTORAGE_UPLOAD_PRESIGNED_URL_EXPIRATION_MINUTES:60}
      allowed-mime-types: ${OBJECTSTORAGE_UPLOAD_ALLOWED_MIME_TYPES:application/pdf,image/jpeg,image/png,image/webp,image/tiff,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
  platform:
    # Platform-wide operational mode: MULTI_TENANT (default) or SINGLE_TENANT.
    # Must be the same value across all core services (IAM, Billing, CMS, etc.).
    rollout-mode: ${ROLLOUT_MODE:MULTI_TENANT}
  tenancy:
    # Declared for platform consistency — tenant routing comes from foundation-tenancy
    # (TenantContext + MyBatisSchemaInterceptor). Defaults match docintelligence-catalog-service.
    default-tenant-key: platform
    default-tenant-name: ${DEFAULT_TENANT_NAME:Acme Corp.}
    schema-prefix: t_
    default-schema: public
    provisioning-timeout: PT10M
  liquibase:
    # This service owns no changelogs — docintelligence-catalog-service runs them, and
    # Liquibase is not on this service's classpath, so TenantLiquibaseRunner is never
    # created. The flag is kept explicit to document the intent.
    tenant-runner-enabled: false
    # foundation-tenancy binds these once a validation provider is present on the classpath,
    # and its @NotBlank constraints require non-blank values. Both paths are inert here
    # (no Liquibase, no runner) and mirror docintelligence-catalog-service for consistency.
    system-change-log: db/changelog/system/db.changelog-system.xml
    tenant-change-log: db/changelog/tenant/db.changelog-tenant.xml

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
